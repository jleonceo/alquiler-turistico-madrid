name: ci

# Es la única vigilancia que no depende de que el portátil esté encendido. Ejecuta el escáner sobre lo que git publica,
# pasa las pruebas.
#
# No descarga los datos de Inside Airbnb: la fuente pide descargarlos una vez y no en cada ejecución. Los bancos que abren
# datos reales se saltan aquí y run_tests.py los nombra. El recorrido en navegador necesita Edge y también se salta.

on:
  push:
  pull_request:

jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Dependencias
        run: pip install -r requirements.txt
      - name: Escáner de lo publicado
        run: python scripts/escanear_repositorio.py
      - name: Pruebas
        run: python ejecutar.py
